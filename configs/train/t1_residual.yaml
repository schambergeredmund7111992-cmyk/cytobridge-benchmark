# @package _global_
# ^ REQUIRED on hydra-core 1.3.2 so these overrides land at root and actually
#   override /train/v1 (without it they go under `train.*` / silently no-op).
#
# Config-gated additions, otherwise identical to v1:
#   - model.residual_decoder=true  -> predict drug delta on top of known control
#   - model.pool_mode=drug_query   -> pool cell tokens with drug as the query
#   - loss.lam_direction=1.0        -> 1 - Pearson(pred_logfc, true_logfc), O(1)
# Run:
#   python train.py --config-name=train/t1_residual
# Sweep the knobs (Hydra multirun):
#   python train.py -m --config-name=train/t1_residual loss.lam_direction=0.5,1.0,2.0
defaults:
  - /train/v1@_global_
  - _self_

run_name: t1_residual

model:
  residual_decoder: true
  pool_mode: drug_query

loss:
  lam_direction: 1.0     # direction loss (scale-free, ~O(1)); sweep [0.5, 1.0, 2.0]
  # lam_delta: 0.0       # optional DEG-weighted Huber; set with scripts/check_loss_scale.py
  # huber_beta: 1.0

wandb:
  name: t1_residual_sciplex
