name: cytobridge
channels:
  - pytorch
  - nvidia
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - pip
  - cudatoolkit=11.8
  - pytorch=2.3.1
  - torchvision
  - pip:
      # Deep learning core
      - pytorch-lightning==2.3.0
      - transformers==4.42.0
      - tokenizers
      # Single-cell stack
      - scanpy==1.10.0
      - anndata==0.10.7
      - scvi-tools==1.1.2
      - pertdata==0.5.0
      - datasets>=2.20
      - huggingface-hub>=0.23
      - pyarrow>=15
      - scikit-misc>=0.3.1
      # Cheminformatics
      - rdkit==2024.3.3
      # Foundation models
      - scgpt==0.2.4
      # Pathway analysis
      - gseapy==1.1.3
      # Baselines
      # PyPI package is `cell-gears`; import name remains `gears`.
      - cell-gears==0.1.2
      - scikit-learn==1.5.0
      # Config + experiment tracking
      - hydra-core==1.3.2
      - omegaconf
      - wandb==0.17.0
      # LLM clients — all via the OpenAI-compatible interface
      # (covers Kimi / DeepSeek / Qwen via vLLM)
      - openai>=1.40.0
      # local LLM inference (open-source model served via vLLM)
      - vllm>=0.6.3
      # Bio APIs (PubMed)
      - biopython==1.83
      # Utility
      - tqdm
      - pyyaml
      - h5py
      - matplotlib==3.9.0
      - seaborn==0.13.2
      - jupyterlab
      - ipykernel
      - pytest
      - pytest-cov
