[project]
name = "cytobridge"
version = "1.0.3"
description = "Leakage-controlled benchmark for conditional drug identity in single-cell perturbation prediction."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Xichen Zhao" },
    { name = "Guanxing Chen" },
]
dependencies = [
    "torch>=2.3,<2.8",
    "pytorch-lightning>=2.3,<2.4",
    "scanpy>=1.10,<1.11",
    "anndata>=0.10,<0.11",
    "transformers>=4.42,<4.50",
    "datasets>=2.20",
    "huggingface-hub>=0.23",
    "rdkit>=2024.3.3",
    "gseapy>=1.1.3,<1.2",
    "scikit-learn>=1.5,<1.6",
    "hydra-core>=1.3.2,<1.4",
    "omegaconf>=2.3",
    "wandb>=0.17",
    "biopython>=1.83",
    "pyarrow>=15",
    "scikit-misc>=0.3.1",
    "tqdm",
    "pyyaml",
    "h5py",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[project.optional-dependencies]
foundation = [
    "scgpt==0.2.4",
    "torchtext==0.18.0",
]
baselines = [
    "scvi-tools>=1.1,<1.2",
    "cell-gears>=0.1.2",
]
agent = [
    "openai>=1.40.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "black",
    "isort",
    "ruff",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cytobridge*", "agent*", "data*", "eval*", "external*", "release*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"
